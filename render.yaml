services:
  - type: web
    name: garmin-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /mcp
    envVars:
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: MCP_BEARER_TOKEN
        generateValue: true
      - key: GARMINTOKENS_BASE64
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
